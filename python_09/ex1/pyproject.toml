[project]
name = "ex1"
version = "0.1.0"
description = "Matrix data analysis project"
authors = [
    {name = "Heider Fandino",email = "heiderfandino@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "numpy (>=2.2.6,<2.3.0)",
    "matplotlib (>=3.10.8,<3.11.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
